services:
  postgres:
    image: postgres:16-alpine
    container_name: marinero_postgres
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: marinero
      POSTGRES_USER: marinero
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marinero -d marinero']
      interval: 5s
      timeout: 5s
      retries: 10

  nextjs:
    build:
      context: .
      dockerfile: docker/nextjs/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: marinero_nextjs
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: marinero_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - nextjs

  certbot:
    image: certbot/certbot:latest
    container_name: marinero_certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'

volumes:
  postgres_data:
  certbot_www:
  certbot_certs:
