services:
  postgres:
    image: postgres:16-alpine
    container_name: marinero_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: marinero
      POSTGRES_USER: marinero
      POSTGRES_PASSWORD: marinero_local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marinero -d marinero"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: marinero_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: marinero_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin123;
        mc mb --ignore-existing local/marinero-public;
        mc mb --ignore-existing local/marinero-private;
        mc anonymous set public local/marinero-public;
        echo 'MinIO buckets created';
      "

  nextjs:
    build:
      context: .
      dockerfile: docker/nextjs/Dockerfile.dev
    container_name: marinero_nextjs
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env.local
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://marinero:marinero_local_password@postgres:5432/marinero
      # Внутри docker-сети MinIO доступен по имени сервиса, а не localhost
      - S3_ENDPOINT=http://minio:9000

volumes:
  postgres_data:
  minio_data:
